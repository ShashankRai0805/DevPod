apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: replit-cluster-new
  region: us-east-1
  version: "1.34"

managedNodeGroups:
  - name: replit-workers
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    amiFamily: AmazonLinux2023
    volumeSize: 20
    privateNetworking: false

autoModeConfig:
  enabled: false