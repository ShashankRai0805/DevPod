apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: init-service-ingress
  namespace: repli-system
  annotations:
    # Example annotations for Nginx Ingress or AWS ALB
    # kubernetes.io/ingress.class: nginx
    # alb.ingress.kubernetes.io/scheme: internet-facing
spec:
  rules:
  - host: init.yourdomain.com # Update with your domain or remove the host field entirely for ALB based path routing
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: init-service
            port:
              number: 80
