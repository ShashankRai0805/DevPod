# ============================================================
# 1. Cluster-level permissions
#    Used by the Orchestrator to manage/check namespaces
# ============================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orchestrator-cluster-role
rules:
  - apiGroups: [""]
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

---
# ============================================================
# 2. Bind ClusterRole to Orchestrator ServiceAccount
# ============================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orchestrator-cluster-rolebinding
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: replit-control-plane
roleRef:
  kind: ClusterRole
  name: orchestrator-cluster-role
  apiGroup: rbac.authorization.k8s.io

---
# ============================================================
# 3. Namespace-level permissions
#    Used by the Orchestrator inside the "replit" namespace
# ============================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orchestrator-role
  namespace: replit
rules:

  # Core Kubernetes resources
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Deployments and ReplicaSets
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/status
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Ingress resources
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

---
# ============================================================
# 4. Bind namespace-level Role to Orchestrator ServiceAccount
# ============================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator-rolebinding
  namespace: replit
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: replit-control-plane
roleRef:
  kind: Role
  name: orchestrator-role
  apiGroup: rbac.authorization.k8s.io